<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modelo de caixas</title>
    <style>
        h1 {
            background-color: lightgray;
            height: 300px;
            width: 300px;

            outline: 7px dashed salmon;
            border: 10px solid darkgreen;

            margin: auto;
            padding: 10px;
        }

        a {
            border: 2px red solid;
        }
    </style>
</head>
<body>
    <h1>Exemplo de caixa em box-level</h1>
    <p>Parágrafos são box-level</p>
    <a href="#">Links são in-line level</a>
</body>
</html>
